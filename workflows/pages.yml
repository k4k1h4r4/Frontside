name: Publish Frontside

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Use the repository's actual default branch, whether main or master.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node for checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check scripts and update behavior
        run: |
          node --check nav.js
          node --check site-update.js
          node --test site-update.test.cjs

      - name: Stamp a unique release
        env:
          RELEASE_VERSION: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: python release.py "$RELEASE_VERSION"

      - name: Prepare public files
        run: |
          mkdir _site
          cp *.html *.css nav.js bingo.js site-update.js version.json manifest.webmanifest favicon.ico CNAME _site/
          cp -R Arcade images _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
