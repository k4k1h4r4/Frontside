<html lang="en">

<meta charset="utf-8">

<title>Coaster Stacking &mdash; Frontside Arcade</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--cream:#f2e4c8;--amber:#e6a52f;--muted:#b7a88f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}body{margin:0;color:var(--cream);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 40%,#49301a66,transparent 60%),repeating-linear-gradient(90deg,#ffffff03 0 2px,transparent 2px 80px),linear-gradient(145deg,#21160f,#0e0906 80%);height:100vh;height:100svh;overflow:hidden}
main{max-width:520px;margin:auto;height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:max(clamp(8px,1.5svh,18px),env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(clamp(10px,1.8svh,22px),env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}

.heading{flex:none;text-align:center;margin-top:clamp(5px,2svh,26px)}.eyebrow{font:10px Arial,sans-serif;letter-spacing:2.5px;color:var(--amber)}h1{font:clamp(25px,4.6svh,40px) Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;letter-spacing:1px;margin:clamp(3px,.8svh,8px) 0}.instructions{font-size:14px;color:var(--muted);margin:0;line-height:1.4}
.stage{flex:1;min-height:0;position:relative;margin:clamp(4px,1svh,10px) 0}canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.result{flex:none;text-align:center;min-height:clamp(42px,7.4svh,64px)}h2{font:24px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;letter-spacing:1px;margin:0 0 6px}.result p{font-size:14px;color:var(--muted);margin:0;line-height:1.4}
button{width:100%;flex:none;min-height:clamp(46px,6.8svh,60px);margin:clamp(7px,1.6svh,14px) 0 0;border:1px solid #f6c967;border-radius:10px;background:var(--amber);box-shadow:0 4px 0 #83571a;color:#21160f;font:bold 18px Arial,sans-serif;letter-spacing:2px;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid var(--cream);outline-offset:5px}button[aria-disabled="true"]{opacity:.5;cursor:wait}button.moving{background:#c84b39;border-color:#df7563;color:#fff2de;box-shadow:0 4px 0 #762a21}.footer{display:flex;flex:none;justify-content:space-between;gap:8px;margin-top:clamp(7px,1.9svh,22px);font:10px Arial,sans-serif;letter-spacing:1px;color:var(--muted)}.footer b{color:var(--cream)}

@media(orientation:landscape) and (max-height:550px){main{max-width:800px;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;height:100%}header,.footer{grid-column:1/-1}.stage{grid-column:1;grid-row:2/5;margin:0}.heading,.result,button{grid-column:2}.heading,button,.footer{margin:0}button{align-self:start}}
</style>
<style>
/* Site header — matches the frontsidebar.com nav bar */
.site-head{display:flex;align-items:center;gap:clamp(10px,4vw,22px);width:100%;flex:0 0 auto;padding:2px 2px 8px;border-bottom:1px solid #8c7425}
.site-head .logo{display:block;flex:0 0 auto;line-height:0}
.site-head .logo img{display:block;width:clamp(100px,30vw,150px);height:34px;object-fit:contain;object-position:left center;filter:drop-shadow(0 4px 18px rgba(0,0,0,.55))}
.site-head .back{font:400 12px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#aab0bd;text-decoration:none;white-space:nowrap;padding:8px 0 6px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.site-head .back:hover,.site-head .back:focus-visible{color:#f5d76e;border-bottom-color:#d4af37}
.site-head .tag{margin-left:auto;text-align:right;font:600 11px/1.25 'Oswald','Arial Narrow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f5d76e}
.site-head .tag small{display:block;font-weight:400;font-size:9.5px;letter-spacing:.16em;color:#aab0bd;margin-top:3px}
@media(max-width:380px){.site-head{gap:10px}.site-head .back{font-size:11px;letter-spacing:.12em}.site-head .tag{font-size:10px}}
</style>

  <meta name="site-version" content="2026-09-15-02">
  <script defer src="../site-update.js?v=2026-09-15-02"></script>
<link rel="stylesheet" href="leaderboard.css?v=1">
<script defer src="leaderboard.js?v=2"></script>
</head>
<body data-leaderboard-game="coaster-stacking">
<main>
<header class="site-head"><a class="logo" href="../index.html" aria-label="Frontside home"><img src="../images/Frontside-nav.webp" alt="Frontside Table Gang" width="150" height="34"></a><a class="back" href="arcade.html">&#8592; Arcade</a><span class="tag">Arcade<small>Game 03</small></span></header>
<div class="heading"><div class="eyebrow">ONE MORE. JUST ONE MORE.</div><h1>COASTER STACKING</h1><p class="instructions">Stop over the stack. Keep the overlap.</p></div>
<div class="stage"><canvas id="game" role="img" aria-label="A coaster ready to stack">Stack moving coasters using the Stop button.</canvas></div>
<div class="result" role="status" aria-live="polite" aria-atomic="true"><h2 id="title">HOW HIGH CAN YOU GO?</h2><p id="message">Tap Start, then Stop to place each coaster.</p></div>
<button id="control" type="button">START</button>
<div class="footer"><span>STACKED <b id="score">0</b></span><span>WIDTH <b id="width">100%</b></span><span>BEST <b id="best">0</b></span></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),control=$('control');
const KEY='frontsidebar.coasterStacking.best.v1',BASE=144,LEFT=20,RIGHT=340,STEP=10;
const playLogo=new Image();playLogo.onload=()=>requestDraw();playLogo.src='../images/Frontside.webp';
let state='ready',stack=[{x:(360-BASE)/2,w:BASE}],score=0,best=0,active=null,cut=null,started=0,settleAt=0,unlockAt=0,frame=0,pausedAt=0,sceneW=360,sceneH=380;
try{const saved=Number(localStorage.getItem(KEY));if(Number.isSafeInteger(saved)&&saved>=0)best=saved;}catch{}
$('best').textContent=best;
function overlap(a,b){const x=Math.max(a.x,b.x);return {x,w:Math.max(0,Math.min(a.x+a.w,b.x+b.w)-x)};}
function movingX(now){const range=RIGHT-LEFT-active.w,speed=115+score*9,travel=(now-started)*speed/1000,phase=((travel%(range*2))+range*2)%(range*2);return LEFT+(active.fromRight?range-Math.abs(range-phase):Math.abs(range-phase));}
function next(now){const top=stack[stack.length-1];active={x:LEFT,w:top.w,fromRight:score%2===0};started=now;state='moving';active.x=movingX(now);control.textContent='STOP';control.classList.add('moving');control.setAttribute('aria-disabled','false');}
function stop(now){
 active.x=movingX(now);const top=stack[stack.length-1],kept=overlap(active,top),y=baseY()-stack.length*STEP;
 control.classList.remove('moving');
 if(kept.w<=0){cut={x:active.x,w:active.w,y,side:active.x<top.x?-1:1,time:now};active=null;state='over';window.ArcadeLeaderboard?.complete('coaster-stacking',score);unlockAt=now+1000;control.textContent='PLAY AGAIN';control.setAttribute('aria-disabled','true');$('title').textContent='STACK DOWN!';$('message').textContent=`${score} coaster${score===1?'':'s'} stacked. Give it another shot.`;canvas.setAttribute('aria-label',`Game over. ${score} coasters stacked.`);return;}
 const lost=active.w-kept.w;
 if(lost>0){cut={x:active.x<top.x?active.x:kept.x+kept.w,w:lost,y,side:active.x<top.x?-1:1,time:now};}
 stack.push(kept);score++;active=null;state='settling';settleAt=now+600;control.textContent='STACKING…';control.setAttribute('aria-disabled','true');
 $('score').textContent=score;$('width').textContent=(kept.w/BASE*100).toFixed(1)+'%';
 $('title').textContent=lost<.5?'PERFECT STACK!':lost<BASE*.06?'NICE AND STEADY':'KEEP IT TOGETHER';
 $('message').textContent=`${(kept.w/BASE*100).toFixed(1)}% width left. Next coaster is faster.`;
 canvas.setAttribute('aria-label',`${score} coasters stacked, ${(kept.w/BASE*100).toFixed(1)} percent width remaining.`);
 if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem(KEY,String(best));}catch{}}
}
function activate(){const now=performance.now();if(document.hidden||state==='settling'||now<unlockAt)return;
 if(state==='moving'){stop(now);requestDraw();return;}
 stack=[{x:(360-BASE)/2,w:BASE}];score=0;cut=null;$('score').textContent='0';$('width').textContent='100%';$('title').textContent='LINE IT UP';$('message').textContent='Tap Stop when the coaster is over the stack.';next(now);requestDraw();
}
function baseY(){return Math.max(sceneH-45,sceneH*.05+stack.length*STEP);}
function coaster(x,y,w,index,alpha=1){
 ctx.save();ctx.globalAlpha=alpha;const colors=['#f5d99e','#ebc886','#fff0c4','#e8d5ab'];ctx.fillStyle=colors[index%colors.length];ctx.fillRect(x,y,w,7);ctx.fillStyle='#c6a76e';ctx.fillRect(x,y+7,w,2);ctx.fillStyle='#fff8e5';ctx.fillRect(x,y,w,1);
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,9);ctx.clip();ctx.fillStyle='#51331d';ctx.globalAlpha=alpha*.48;for(let i=0;i<w;i+=13)ctx.fillRect(x+i+3,y+4,1,1);ctx.restore();ctx.restore();
}
function draw(now){
 ctx.clearRect(0,0,360,sceneH);const base=baseY();
 // Frontside logo, faded into the back wall of the playfield
 if(playLogo.complete&&playLogo.naturalWidth){const lw=190,lh=lw*playLogo.naturalHeight/playLogo.naturalWidth;
  ctx.save();ctx.globalAlpha=.18;ctx.drawImage(playLogo,(360-lw)/2,sceneH*.5-lh/2,lw,lh);ctx.restore();}
 ctx.strokeStyle='#e6a52f18';ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(180,14);ctx.lineTo(180,sceneH-25);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#6b472b';ctx.fillRect(15,base+9,330,6);ctx.fillStyle='#0004';ctx.fillRect(15,base+15,330,5);
 for(let i=Math.max(0,Math.ceil((base-sceneH)/STEP));i<stack.length;i++){const c=stack[i];coaster(c.x,base-i*STEP,c.w,i);}
 if(active){active.x=movingX(now);const y=base-stack.length*STEP;
 ctx.fillStyle='#e6a52f12';const top=stack[stack.length-1];ctx.fillRect(top.x,y-6,top.w,STEP+6);coaster(active.x,y,active.w,stack.length);}
 if(cut){const t=(now-cut.time)/1000;coaster(cut.x+cut.side*t*65,cut.y+t*t*600,cut.w,score,Math.max(0,1-t));if(t>=1)cut=null;}
}
function loop(now){frame=0;if(document.hidden)return;if(state==='settling'&&now>=settleAt)next(now);if(state==='over'&&now>=unlockAt)control.setAttribute('aria-disabled','false');draw(now);if(state==='moving'||state==='settling'||cut||(state==='over'&&now<unlockAt))requestDraw();}
function requestDraw(){if(!frame&&!document.hidden)frame=requestAnimationFrame(loop);}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);sceneW=rect.width;sceneH=360*rect.height/Math.max(1,rect.width);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/360,0,0,canvas.height/sceneH,0,0);requestDraw();}
new ResizeObserver(resize).observe(canvas);
control.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;e.preventDefault();control.focus({preventScroll:true});activate();});
control.addEventListener('click',e=>{if(e.detail===0)activate();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pausedAt=performance.now();cancelAnimationFrame(frame);frame=0;}else{const pause=performance.now()-pausedAt;started+=pause;settleAt+=pause;if(cut)cut.time+=pause;requestDraw();}});
</script>
</body>
</html>
