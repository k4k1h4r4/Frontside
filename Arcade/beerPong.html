<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beer Pong &mdash; Frontside Arcade</title>
<meta name="theme-color" content="#0b0705">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#21160f; --wood2:#342118; --felt:#174c45; --felt2:#0d3833;
    --cream:#f2e4c8; --amber:#e6a52f; --red:#9f3025; --red2:#c84b39;
    --ink:#17110d; --muted:#b7a88f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100vh;height:100svh;overflow:hidden;background:#120d09;color:var(--cream);
    font-family:Georgia,"Times New Roman",serif;touch-action:none;overscroll-behavior:none}
  body{
    background:
      radial-gradient(circle at 50% 25%,rgba(255,190,80,.07),transparent 35%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 80px),
      linear-gradient(145deg,var(--wood),#0e0906 70%);
  }
  #app{height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  #gameWrap{position:relative;width:min(680px,100%);flex:1;min-height:0;display:flex;justify-content:center}
  canvas{display:block;aspect-ratio:.62;width:min(100%,430px);height:100%;border:5px solid #7d593a;border-radius:14px;
    box-shadow:0 10px 35px rgba(0,0,0,.65),inset 0 0 0 2px #d5a66d; background:var(--felt)}
  /* In landscape, height is the scarce dimension: fill it and let width follow the aspect-ratio
     instead of stretching wide and squashing the cup triangle. */
  @media (orientation:landscape){
    canvas{width:auto;max-width:100%}
  }
  #hud{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:min(94%,400px);max-width:100%;
    display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 2px #000}
  .stat{text-align:center;background:rgba(14,9,6,.72);border:1px solid rgba(242,228,200,.2);border-radius:9px;padding:5px 9px;min-width:74px}
  .stat b{display:block;font:700 18px/1 Impact,Arial,sans-serif;color:var(--amber)}
  .stat small{font:10px Georgia,serif;color:#d6c6aa;letter-spacing:1px}
  #message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:82%;
    text-align:center;pointer-events:none;opacity:0;transition:opacity .15s;text-shadow:0 3px 5px #000}
  #message.show{opacity:1}
  #message h1{margin:0;font:700 40px Impact,Arial,sans-serif;letter-spacing:1px;color:#fff0cb}
  #message p{margin:6px 0 0;font-size:16px}
  #hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);width:min(90%,380px);max-width:100%;
    text-align:center;font-size:13px;line-height:1.35;color:#cbbba0;pointer-events:none;text-shadow:0 2px 4px #000}
  #hint strong{color:var(--amber)}
  button{border:0;border-radius:9px;padding:13px 20px;min-height:46px;display:inline-flex;align-items:center;
    justify-content:center;background:var(--amber);color:#20140b;
    font:bold 14px Arial,sans-serif;letter-spacing:.5px;box-shadow:0 3px 0 #8c5f18;cursor:pointer}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #8c5f18}
  #overlay{position:absolute;inset:0;background:rgba(10,7,5,.88);display:none;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto}
  #overlay.show{display:flex}
  .card{width:min(360px,94%);max-width:100%;background:#1a120d;border:2px solid #765435;border-radius:15px;padding:25px;
    text-align:center;box-shadow:0 15px 50px #000;margin:auto}
  .card .eyebrow{font:bold 11px Arial,sans-serif;letter-spacing:2px;color:var(--amber)}
  .card h2{font:700 40px Impact,Arial,sans-serif;margin:7px 0 5px}
  .card p{color:#d0c0a6;line-height:1.45;margin:8px 0 20px}
  .score{font:bold 22px Arial,sans-serif;margin:12px 0 20px}
  @media (max-height:650px){
    .stat{padding:3px 7px;min-width:66px}.stat b{font-size:15px}
    #hint{font-size:11px;bottom:10px}
  }
</style>
<style>
/* Site header — matches the frontsidebar.com nav bar */
.site-head{display:flex;align-items:center;gap:clamp(10px,4vw,22px);width:100%;flex:0 0 auto;padding:2px 2px 8px;border-bottom:1px solid #8c7425}
.site-head .logo{display:block;flex:0 0 auto;line-height:0}
.site-head .logo img{display:block;width:clamp(100px,30vw,150px);height:34px;object-fit:contain;object-position:left center;filter:drop-shadow(0 4px 18px rgba(0,0,0,.55))}
.site-head .back{font:400 12px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#aab0bd;text-decoration:none;white-space:nowrap;padding:8px 0 6px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.site-head .back:hover,.site-head .back:focus-visible{color:#f5d76e;border-bottom-color:#d4af37}
.site-head .tag{margin-left:auto;text-align:right;font:600 11px/1.25 'Oswald','Arial Narrow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f5d76e}
.site-head .tag small{display:block;font-weight:400;font-size:9.5px;letter-spacing:.16em;color:#aab0bd;margin-top:3px}
.site-head{width:min(680px,100%)}
@media (max-height:650px){.site-head{padding-bottom:4px}.site-head .logo img{height:28px}}
@media(max-width:380px){.site-head{gap:10px}.site-head .back{font-size:11px;letter-spacing:.12em}.site-head .tag{font-size:10px}}
</style>
</head>
<body>
<div id="app">
  <header class="site-head">
    <a class="logo" href="../index.html" aria-label="Frontside home"><img src="../images/Frontside-nav.webp" alt="Frontside Table Gang" width="150" height="34"></a>
    <a class="back" href="arcade.html">&#8592; Arcade</a>
    <div class="tag" id="roundLabel">Round 1<small>20 Balls</small></div>
  </header>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="stat"><b id="score">0</b><small>SCORE</small></div>
      <div class="stat"><b id="cups">10</b><small>CUPS LEFT</small></div>
      <div class="stat"><b id="balls">20</b><small>BALLS LEFT</small></div>
    </div>
    <div id="message"><h1 id="msgTitle"></h1><p id="msgText"></p></div>
    <div id="overlay">
      <div class="card">
        <div class="eyebrow" id="overEyebrow">ROUND OVER</div>
        <h2 id="overTitle">NICE THROW</h2>
        <div class="score" id="overScore"></div>
        <p id="overText"></p>
        <button id="overButton">NEXT ROUND</button>
      </div>
    </div>
    <div id="hint"><strong>DRAG</strong> from the ball toward where you want to throw. Release to fire.</div>
  </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const wrap=document.getElementById('gameWrap');
const cupsEl=document.getElementById('cups'), ballsEl=document.getElementById('balls'),
      scoreEl=document.getElementById('score');
const roundEl=document.getElementById('roundLabel'), hint=document.getElementById('hint'),
      hud=document.getElementById('hud');
const overlay=document.getElementById('overlay'), overTitle=document.getElementById('overTitle'),
      overText=document.getElementById('overText'), overScore=document.getElementById('overScore'),
      overEyebrow=document.getElementById('overEyebrow'), overButton=document.getElementById('overButton');

const tableLogo=new Image();tableLogo.src='../images/Frontside.webp';
let W=0,H=0,dpr=1, round=1, balls=20, cups=[], ball={x:0,y:0,r:9}, score=0;
let dragging=false, dragX=0,dragY=0, shot=null, last=0, paused=false;
const maxRounds=11;

function resize(){
  const r=canvas.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
  W=r.width; H=r.height; canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  hud.style.width=Math.round(W*.94)+'px'; hint.style.width=Math.round(W*.9)+'px';
  // Reflow cups to the real canvas size (existing alive/dead state is preserved).
  cups = cupLayout(cups);
  resetBall();
}
new ResizeObserver(resize).observe(canvas);

function cupLayout(existing){
  // 10-cup triangle, target at top.
  const cx=W/2, top=Math.max(76,H*.15), gap=Math.min(40,W*.085), rad=Math.max(17,Math.min(23,W*.055));
  const rows=[4,3,2,1], out=[]; let idx=0;
  rows.forEach((n,row)=>{
    const y=top+row*gap;
    const start=cx-(n-1)*gap/2;
    for(let i=0;i<n;i++){
      const alive = existing && existing[idx] ? existing[idx].alive : true;
      out.push({x:start+i*gap,y,r:rad,alive,shake:0});
      idx++;
    }
  });
  return out;
}
function resetRound(){
  balls=21-round; cups=cupLayout(); shot=null; paused=false; resetBall();
  updateHUD();
  roundEl.innerHTML=`ROUND ${round}<small>${balls} BALL${balls===1?'':'S'} • ${maxRounds} ROUNDS</small>`;
  hint.innerHTML=`<strong>DRAG</strong> from the ball toward where you want to throw. Release to fire.`;
}
function resetBall(){ball.x=W/2;ball.y=H*.75;ball.r=Math.max(7,Math.min(10,W*.022))}
function updateHUD(){cupsEl.textContent=cups.filter(c=>c.alive).length;ballsEl.textContent=balls;scoreEl.textContent=score}

function pos(e){const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
  if(paused||shot||balls<=0)return;
  const p=pos(e), dx=p.x-ball.x,dy=p.y-ball.y;
  if(Math.hypot(dx,dy)<55){dragging=true;dragX=p.x;dragY=p.y;canvas.setPointerCapture(e.pointerId);e.preventDefault()}
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return; const p=pos(e);dragX=p.x;dragY=p.y;e.preventDefault();
});
canvas.addEventListener('pointerup',e=>{
  if(!dragging)return; dragging=false; const p=pos(e);dragX=p.x;dragY=p.y;
  const dx=ball.x-p.x,dy=ball.y-p.y,len=Math.hypot(dx,dy);
  if(len<12)return;
  // Drag farther = more power; cap for consistent mobile play.
  const power=Math.min(len,Math.min(W*.52,190));
  const ux=dx/len,uy=dy/len;
  balls--; updateHUD();
  shot={x:ball.x,y:ball.y,vx:ux*(250+power*3.1),vy:uy*(250+power*3.1),t:0,duration:0.82+power/520,
        startX:ball.x,startY:ball.y};
  e.preventDefault();
});

function finishShot(hit){
  if(hit){ hit.alive=false; hit.shake=1; score++; showFlash("SUNK!","+1 point."); }
  else if(Math.random()<.15) showFlash("RIM!","So close.");
  else showFlash("MISS","Back to the bar.");
  shot=null; resetBall(); updateHUD();
  const remaining=cups.filter(c=>c.alive).length;
  if(remaining===0){ setTimeout(winRound,500); }
  else if(balls===0){ setTimeout(loseRound,500); }
}
function showFlash(t,p){
  document.getElementById('msgTitle').textContent=t;
  document.getElementById('msgText').textContent=p;
  const m=document.getElementById('message');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),380);
}
function winRound(){
  paused=true;
  // Clearing the table banks a bonus point for every ball you did not need.
  const bonus=Math.max(0,balls); score+=bonus; updateHUD();
  const roundTotal=10+bonus;
  if(round===maxRounds){
    overEyebrow.textContent="LAST CALL";
    overTitle.textContent="YOU CLEARED THE BAR";
    overScore.textContent=`FINAL SCORE ${score}`;
    overText.textContent=`All 11 rounds, every cup sunk. Round 11 paid 10 cups + ${bonus} ball${bonus===1?'':'s'} left over.`;
    overButton.textContent="PLAY AGAIN";
    overButton.onclick=()=>{round=1;score=0;overlay.classList.remove('show');resetRound()};
  }else{
    overEyebrow.textContent=`ROUND ${round} CLEARED`;
    overTitle.textContent="NICE POUR";
    overScore.textContent=`+${roundTotal} THIS ROUND • SCORE ${score}`;
    overText.textContent=`10 cups + ${bonus} ball${bonus===1?'':'s'} left over. Round ${round+1} gets one ball tougher.`;
    overButton.textContent="NEXT ROUND";
    overButton.onclick=()=>{round++;overlay.classList.remove('show');resetRound()};
  }
  overlay.classList.add('show');
}
function loseRound(){
  paused=true;
  // Out of balls, so there is no leftover-ball bonus — only the cups already banked.
  const used=21-round, sunk=10-cups.filter(c=>c.alive).length;
  overEyebrow.textContent=`ROUND ${round} OVER`;
  overTitle.textContent="LAST CALL";
  overScore.textContent=`FINAL SCORE ${score}`;
  overText.textContent=round===maxRounds ? `Ten balls means perfection. You sank ${sunk} before the rack ran dry.` :
    `You used all ${used} shots and sank ${sunk}. No balls left over, so no bonus.`;
  overButton.textContent="START OVER";
  overButton.onclick=()=>{round=1;score=0;overlay.classList.remove('show');resetRound()};
  overlay.classList.add('show');
}

function drawWood(){
  ctx.fillStyle='#3a2417';ctx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=28){ctx.strokeStyle='rgba(255,220,150,.035)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,y+Math.sin(y)*5);ctx.bezierCurveTo(W*.3,y-8,W*.7,y+9,W,y-3);ctx.stroke()}
}
function drawTable(){
  const pad=9;
  const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#155049');grd.addColorStop(1,'#0d3732');
  ctx.fillStyle=grd;ctx.fillRect(pad,pad,W-pad*2,H-pad*2);
  ctx.strokeStyle='rgba(242,228,200,.55)';ctx.lineWidth=1.5;
  ctx.strokeRect(19,19,W-38,H-38);
  ctx.strokeStyle='rgba(242,228,200,.22)';ctx.beginPath();ctx.moveTo(24,H*.5);ctx.lineTo(W-24,H*.5);ctx.stroke();
  // Frontside logo, faded into the felt at centre court
  if(tableLogo.complete && tableLogo.naturalWidth){
    const lw=Math.min(W*.62,W-70), lh=lw*tableLogo.naturalHeight/tableLogo.naturalWidth;
    ctx.save();ctx.globalAlpha=.28;
    ctx.drawImage(tableLogo,(W-lw)/2,H*.5-lh/2,lw,lh);
    ctx.restore();
  } else {
    ctx.fillStyle='rgba(242,228,200,.12)';ctx.font=`bold ${Math.max(11,W*.035)}px Arial`;ctx.textAlign='center';
    ctx.fillText('FRONTSIDE',W/2,H*.53);
  }
  // worn marks
  ctx.strokeStyle='rgba(0,0,0,.12)';for(let i=0;i<9;i++){let x=30+(i*73)%Math.max(1,W-60),y=80+(i*117)%Math.max(1,H-160);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y+3);ctx.stroke()}
}
function drawCup(c){
  if(!c.alive)return;
  const s=1+(c.shake?Math.sin(performance.now()/35)*.035:0), r=c.r*s;
  ctx.save();ctx.translate(c.x,c.y);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(2,r*.95,r*.85,r*.28,0,0,Math.PI*2);ctx.fill();
  const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#d65740');g.addColorStop(1,'#7d211b');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-r*.75,-r*.45);ctx.lineTo(r*.75,-r*.45);ctx.lineTo(r*.52,r*.85);ctx.quadraticCurveTo(0,r*1.12,-r*.52,r*.85);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,242,215,.82)';ctx.beginPath();ctx.ellipse(0,-r*.45,r*.76,r*.28,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(-r*.22,-r*.5,r*.35,r*.12,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawBall(){
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=7;ctx.shadowOffsetY=3;
  ctx.fillStyle='#f5f0df';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowColor='transparent';ctx.strokeStyle='rgba(80,70,55,.45)';ctx.stroke();ctx.restore();
}
function drawAim(){
  if(!dragging)return;
  const dx=ball.x-dragX,dy=ball.y-dragY,len=Math.hypot(dx,dy),max=Math.min(W*.52,190);
  const p=Math.min(len,max),ux=dx/len,uy=dy/len;
  ctx.save();ctx.strokeStyle='rgba(244,190,67,.85)';ctx.lineWidth=2;ctx.setLineDash([5,7]);
  ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+ux*(120+p*.8),ball.y+uy*(120+p*.8));ctx.stroke();
  ctx.setLineDash([]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.beginPath();
  ctx.arc(ball.x,ball.y,Math.min(30,8+p*.13),0,Math.PI*2);ctx.stroke();ctx.restore();
}
function update(dt){
  if(!shot)return;
  shot.t+=dt;
  const k=Math.min(shot.t/shot.duration,1);
  // Slightly arced trajectory for a satisfying beer-pong look.
  const ease=k*k*(3-2*k);
  ball.x=shot.startX+shot.vx*shot.duration*ease;
  ball.y=shot.startY+shot.vy*shot.duration*ease;
  if(k>=1){
    let hit=null,min=Infinity;
    for(const c of cups)if(c.alive){
      const d=Math.hypot(ball.x-c.x,ball.y-c.y);
      if(d<c.r*.92 && d<min){min=d;hit=c}
    }
    finishShot(hit);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);drawWood();drawTable();
  cups.slice().reverse().forEach(drawCup);
  drawAim();
  drawBall();
  requestAnimationFrame(loop);
}
function loop(t){const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw()}
resetRound(); requestAnimationFrame(loop);
</script>
</body>
</html>
